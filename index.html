<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альбом событий</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4fa;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        h1 {
            color: #1a2a4a;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .header-btn {
            background: #d4af37;
            color: #1a2a4a;
            border: none;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .header-btn:hover {
            background: #c5a02e;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            background: #e0e6f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #1a2a4a;
            transition: 0.2s;
            font-weight: 500;
        }

        .filter-btn.active {
            background: #1a2a4a;
            color: white;
        }

        #cards-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .card-img-wrapper {
            background: #d4af37;
            padding: 3px;
            background-clip: padding-box;
        }

        .card-img-wrapper img {
            display: block;
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
            background: #d4edda;
        }

        .card-content {
            padding: 8px 15px 15px 8px;
            background: #d4edda;
            min-height: 110px;
        }

        .card-content h3 {
            font-size: 26px;
            font-weight: 900;
            color: #1a2a4a;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
            font-family: 'Segoe UI', 'Arial Black', 'Helvetica Neue', sans-serif;
            line-height: 1.1;
            white-space: nowrap;
        }

        .card-graph-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #d4af37;
            color: #1a2a4a;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 20px;
            border: none;
            text-align: center;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 2px;
        }

        .card-graph-btn:hover {
            background: #c5a02e;
        }

        /* Модальное окно — с фоновым изображением */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            overflow-y: auto;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.92);
            background-image: url('https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/%D0%9B%D0%B8%D0%B3%D0%B0%20%D0%90%D0%B2%20%D1%84%D0%BE%D0%BD.png');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #1a2a4a;
            background: rgba(255,255,255,0.7);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,1);
            color: #000;
        }

        #modal-body {
            font-family: 'Segoe UI', Arial, sans-serif;
            position: relative;
            z-index: 1;
        }

        .modal-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .modal-title-row h2 {
            font-size: 28px;
            font-weight: 900;
            color: #1a2a4a;
            margin: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .modal-boss-btn {
            background: #d4af37;
            color: #1a2a4a;
            border: none;
            padding: 8px 30px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: 0.2s;
            transform: translateY(3px);
        }

        .modal-boss-btn:hover {
            background: #c5a02e;
        }

        .modal-type {
            font-size: 16px;
            font-weight: 500;
            color: #1a2a4a;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .modal-divider {
            border: none;
            border-top: 2px solid rgba(212, 175, 55, 0.6);
            margin: 15px 0 20px 0;
        }

        .reward-block {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.75);
            padding: 12px;
            border-radius: 12px;
            backdrop-filter: blur(1px);
        }

        .reward-block h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1a2a4a;
            margin-bottom: 8px;
        }

        .reward-images {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .reward-images img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
            transition: transform 0.2s;
        }

        .reward-images img:hover {
            transform: scale(1.05);
        }

        .image-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            overflow: auto;
            align-items: center;
            justify-content: center;
        }

        .image-modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            margin: auto;
        }

        .image-modal-content img {
            display: block;
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .image-modal .close-img-btn {
            position: absolute;
            top: -40px;
            right: -10px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .image-modal .close-img-btn:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>📖 Альбом событий</h1>
            <button class="header-btn" onclick="openImageModal('https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/kalendar.jpg')">Календарь событий</button>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-type="all">Все</button>
            <button class="filter-btn" data-type="на время">На время</button>
            <button class="filter-btn" data-type="на материалы">На материалы</button>
            <button class="filter-btn" data-type="цветные">Цветные</button>
        </div>
    </header>

    <main id="cards-container"></main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="image-modal" class="image-modal">
        <div class="image-modal-content">
            <button class="close-img-btn">&times;</button>
            <img id="image-modal-img" src="" alt="Увеличенное изображение">
        </div>
    </div>

    <script>
        function openImageModal(src) {
            document.getElementById('image-modal-img').src = src;
            document.getElementById('image-modal').style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('image-modal').style.display = 'none';
            document.getElementById('image-modal-img').src = '';
        }

        const events = [
            {
                "id": 1,
                "название": "Лига Авантюристов",
                "тип": "на время",
                "скриншоты": [
                    "Лига Авантюр 6667.png"
                ],
                "награды": [
                    {
                        "название": "НОВИЧОК — награды",
                        "фото": [
                            "novichok1.jpg",
                            "Л А новичок - 2.jpg",
                            "Л А новичок - 3.jpg"
                        ]
                    },
                    {
                        "название": "ОПЫТНЫЙ — награды",
                        "фото": [
                            "Л А опытный - 1.jpg",
                            "Л А опытный - 2.jpg",
                            "Л А опытный - 3.jpg",
                            "Л А опытный - 4.jpg"
                        ]
                    },
                    {
                        "название": "МАСТЕР — награды",
                        "фото": [
                            "Л А мастер - 1.jpg",
                            "Л А мастер - 2.jpg",
                            "Л А мастер - 3.jpg",
                            "master4.jpg"
                        ]
                    }
                ],
                "график": "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/grafika.jpg"
            }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('cards-container');
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modal-body');
            const closeBtn = document.querySelector('.close-btn');
            const closeImgBtn = document.querySelector('.close-img-btn');
            const imageModal = document.getElementById('image-modal');

            let currentEvents = [...events];

            function renderCards(filterType = 'all') {
                container.innerHTML = '';
                const filtered = filterType === 'all' ? currentEvents : currentEvents.filter(e => e.тип === filterType);
                filtered.forEach(event => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="${event.скриншоты[0]}" alt="${event.название}" onerror="this.src='https://via.placeholder.com/600x400/cccccc/1a2a4a?text=Нет+скрина'">
                        </div>
                        <div class="card-content">
                            <h3>${event.название}</h3>
                            ${event.график ? `<button class="card-graph-btn" onclick="event.stopPropagation(); openImageModal('${event.график}')">График события</button>` : ''}
                        </div>
                    `;
                    card.addEventListener('click', () => openModal(event));
                    container.appendChild(card);
                });
            }

            function openModal(event) {
                let rewardsHtml = '';
                if (event.награды && event.награды.length > 0) {
                    event.награды.forEach(reward => {
                        let imagesHtml = reward.фото.map(src => {
                            const imgSrc = 'https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/' + encodeURIComponent(src);
                            return `<img src="${imgSrc}" alt="${reward.название}" onclick="openImageModal('${imgSrc}')" onerror="this.style.display='none'">`;
                        }).join('');
                        rewardsHtml += `
                            <div class="reward-block">
                                <h3>${reward.название}</h3>
                                <div class="reward-images">${imagesHtml}</div>
                            </div>
                        `;
                    });
                }

                modalBody.innerHTML = `
                    <div class="modal-title-row">
                        <h2>${event.название}</h2>
                        <button class="modal-boss-btn" onclick="openImageModal('https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/result_БОССЫ%20Лига%20Авантюристов.jpeg')">БОССЫ</button>
                    </div>
                    <div class="modal-type">${event.тип}</div>
                    <hr class="modal-divider">
                    ${rewardsHtml}
                `;
                modal.style.display = 'block';
            }

            function closeModal() {
                modal.style.display = 'none';
            }

            closeBtn.addEventListener('click', closeModal);
            window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            closeImgBtn.addEventListener('click', closeImageModal);
            window.addEventListener('click', (e) => { if (e.target === imageModal) closeImageModal(); });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderCards(this.dataset.type);
                });
            });

            renderCards('all');
        });
    </script>
</body>
</html>
