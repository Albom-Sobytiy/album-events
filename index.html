<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альбом событий</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>📖 Альбом событий</h1>
        <div class="filters">
            <button class="filter-btn active" data-type="all">Все</button>
            <button class="filter-btn" data-type="на время">На время</button>
            <button class="filter-btn" data-type="на материалы">На материалы</button>
            <button class="filter-btn" data-type="цветные">Цветные</button>
        </div>
    </header>

    <main id="cards-container">
        <!-- Карточки будут созданы из данных -->
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // Данные событий (здесь только одно событие — «Лига Авантюристов»)
        const events = [
            {
                "id": 1,
                "название": "Лига Авантюристов",
                "тип": "на время",
                "дата": "10–17 августа 2026",
                "этапы": [
                    {
                        "название": "Новичок",
                        "фото": "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/novichok.jpg",
                        "очки": "100"
                    },
                    {
                        "название": "Опытный",
                        "фото": "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/opytny.jpg",
                        "очки": "200"
                    },
                    {
                        "название": "Мастер",
                        "фото": "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/master.jpg",
                        "очки": "300"
                    }
                ],
                "скриншоты": [
                    "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/seedream-5.0-pro_a_Расположить_персонаж.jpeg"
                ]
            }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('cards-container');
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modal-body');
            const closeBtn = document.querySelector('.close-btn');

            let currentEvents = [...events];

            function renderCards(filterType = 'all') {
                container.innerHTML = '';
                const filtered = filterType === 'all' ? currentEvents : currentEvents.filter(e => e.тип === filterType);
                filtered.forEach(event => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${event.скриншоты[0]}" alt="${event.название}" onerror="this.src='https://via.placeholder.com/600x400/cccccc/1a2a4a?text=Нет+скрина'">
                        <div class="card-content">
                            <h3>${event.название}</h3>
                            <span class="type">${event.тип} <button class="boss-btn" onclick="alert('БОССЫ')">БОССЫ</button></span>
                            <div class="date">${event.дата}</div>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal(event));
                    container.appendChild(card);
                });
            }

            function openModal(event) {
                // Отображение этапов (блоков наград)
                let stagesHtml = event.этапы.map((stage, i) => `
                    <li>
                        <strong>${stage.название}</strong><br>
                        <img src="${stage.фото}" alt="${stage.название}" style="max-width: 150px; height: auto; cursor: pointer;" onclick="window.open('${stage.фото}', '_blank')">
                        <br>Очки: ${stage.очки}
                    </li>
                `).join('');

                let galleryHtml = event.скриншоты.map(src => `<img src="${src}" alt="скрин" onerror="this.style.display='none'" style="max-width: 100%; cursor: pointer;" onclick="window.open('${src}', '_blank')">`).join('');

                modalBody.innerHTML = `
                    <h2>${event.название}</h2>
                    <div class="meta">Тип: ${event.тип} | Дата: ${event.дата}</div>
                    <div class="stages"><strong>Награды:</strong><ul>${stagesHtml}</ul></div>
                    <div class="gallery">${galleryHtml}</div>
                `;
                modal.style.display = 'block';
            }

            function closeModal() {
                modal.style.display = 'none';
            }

            closeBtn.addEventListener('click', closeModal);
            window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderCards(this.dataset.type);
                });
            });

            renderCards('all');
        });
    </script>
</body>
</html>
