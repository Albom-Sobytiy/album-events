<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альбом событий</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4fa;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px;
        }

        h1 {
            color: #1a2a4a;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #e0e6f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #1a2a4a;
            transition: 0.2s;
            font-weight: 500;
        }

        .filter-btn.active {
            background: #1a2a4a;
            color: white;
        }

        #cards-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* Заглушка фото с отступами и закруглением */
        .card-img-wrapper {
            padding: 3px;
            background: #dde4f0; /* цвет подложки под фото */
        }

        .card-img-wrapper img {
            display: block;
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px 10px 0 0; /* закругление только сверху */
            background: #c0c8d8; /* цвет, если фото не загрузится */
        }

        .card-content {
            padding: 15px;
        }

        .card-content h3 {
            font-size: 20px;
            font-weight: 800;
            color: #1a2a4a;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
            font-family: 'Segoe UI', 'Arial Black', sans-serif;
        }

        .type-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .type {
            display: inline-block;
            background: #d4af37;
            color: #1a2a4a;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 700;
        }

        .boss-btn {
            background: #8b1a2b;
            color: white;
            border: none;
            padding: 4px 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .boss-btn:hover {
            background: #a02030;
        }

        .rewards {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .reward-block {
            background: #f8faff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #dde4f0;
            text-align: center;
        }

        .reward-block strong {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .reward-block img {
            max-width: 120px;
            height: auto;
            display: block;
            margin: 6px auto;
            border-radius: 6px;
            cursor: pointer;
        }

        .reward-block span {
            font-size: 13px;
            font-weight: 500;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 16px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover {
            color: #1a2a4a;
        }

        #modal-body h2 {
            color: #1a2a4a;
            margin-bottom: 10px;
            font-weight: 800;
        }

        #modal-body .meta {
            color: #6a7a8a;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .gallery img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>📖 Альбом событий</h1>
        <div class="filters">
            <button class="filter-btn active" data-type="all">Все</button>
            <button class="filter-btn" data-type="на время">На время</button>
            <button class="filter-btn" data-type="на материалы">На материалы</button>
            <button class="filter-btn" data-type="цветные">Цветные</button>
        </div>
    </header>

    <main id="cards-container"></main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const events = [
            {
                "id": 1,
                "название": "Лига Авантюристов",
                "тип": "на время",
                "этапы": [
                    { "название": "Новичок", "фото": "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/novichok.jpg", "очки": "100" },
                    { "название": "Опытный", "фото": "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/opytny.jpg", "очки": "200" },
                    { "название": "Мастер", "фото": "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/master.jpg", "очки": "300" }
                ],
                "скриншоты": [
                    "https://raw.githubusercontent.com/Albom-Sobytiy/album-events/main/seedream-5.0-pro_a_Расположить_персонаж.jpeg"
                ]
            }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('cards-container');
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modal-body');
            const closeBtn = document.querySelector('.close-btn');

            let currentEvents = [...events];

            function renderCards(filterType = 'all') {
                container.innerHTML = '';
                const filtered = filterType === 'all' ? currentEvents : currentEvents.filter(e => e.тип === filterType);
                filtered.forEach(event => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="${event.скриншоты[0]}" alt="${event.название}" onerror="this.src='https://via.placeholder.com/600x400/cccccc/1a2a4a?text=Нет+скрина'">
                        </div>
                        <div class="card-content">
                            <h3>${event.название}</h3>
                            <div class="type-wrapper">
                                <span class="type">${event.тип}</span>
                                <button class="boss-btn" onclick="event.stopPropagation(); alert('БОССЫ')">БОССЫ</button>
                            </div>
                            <div class="rewards">
                                ${event.этапы.map(stage => `
                                    <div class="reward-block">
                                        <strong>${stage.название}</strong>
                                        <img src="${stage.фото}" alt="${stage.название}" onclick="event.stopPropagation(); window.open('${stage.фото}', '_blank')" onerror="this.style.display='none'">
                                        <span>Очки: ${stage.очки}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal(event));
                    container.appendChild(card);
                });
            }

            function openModal(event) {
                let stagesHtml = event.этапы.map(stage => `
                    <li>
                        <strong>${stage.название}</strong><br>
                        <img src="${stage.фото}" alt="${stage.название}" style="max-width: 150px; height: auto; cursor: pointer;" onclick="window.open('${stage.фото}', '_blank')" onerror="this.style.display='none'">
                        <br>Очки: ${stage.очки}
                    </li>
                `).join('');

                let galleryHtml = event.скриншоты.map(src => `<img src="${src}" alt="скрин" onclick="window.open('${src}', '_blank')" onerror="this.style.display='none'">`).join('');

                modalBody.innerHTML = `
                    <h2>${event.название}</h2>
                    <div class="meta">Тип: ${event.тип}</div>
                    <div class="stages"><strong>Награды:</strong><ul>${stagesHtml}</ul></div>
                    <div class="gallery">${galleryHtml}</div>
                `;
                modal.style.display = 'block';
            }

            function closeModal() {
                modal.style.display = 'none';
            }

            closeBtn.addEventListener('click', closeModal);
            window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderCards(this.dataset.type);
                });
            });

            renderCards('all');
        });
    </script>
</body>
</html>
