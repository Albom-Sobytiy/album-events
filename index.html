<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альбом событий</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4fa;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px;
        }

        h1 {
            color: #1a2a4a;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #e0e6f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #1a2a4a;
            transition: 0.2s;
            font-weight: 500;
        }

        .filter-btn.active {
            background: #1a2a4a;
            color: white;
        }

        #cards-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* Подложка под фото — белая, отступ 5px */
        .card-img-wrapper {
            background: #ffffff; /* белый */
            padding: 5px;
            background-clip: padding-box;
        }

        .card-img-wrapper img {
            display: block;
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
            background: #c0c8d8;
        }

        .card-content {
            padding: 10px 15px 10px 15px; /* отступ сверху 10px = 1 см */
            background: white;
        }

        /* Название — 32px, жирное, в одну строку */
        .card-content h3 {
            font-size: 32px;
            font-weight: 900;
            color: #1a2a4a;
            margin-bottom: 0;
            letter-spacing: 0.5px;
            font-family: 'Segoe UI', 'Arial Black', 'Helvetica Neue', sans-serif;
            line-height: 1.1;
        }

        /* «на время» — слева, внутри овала центрировано */
        .type-wrapper {
            display: flex;
            justify-content: flex-start;
            margin-top: 4px;
        }

        .type {
            display: inline-block;
            background: #d4af37;
            color: #1a2a4a;
            font-size: 13px;
            padding: 2px 16px;
            border-radius: 16px;
            font-weight: 700;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 16px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover {
            color: #1a2a4a;
        }

        #modal-body h2 {
            color: #1a2a4a;
            margin-bottom: 10px;
            font-weight: 800;
        }

        #modal-body .meta {
            color: #6a7a8a;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .gallery img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>📖 Альбом событий</h1>
        <div class="filters">
            <button class="filter-btn active" data-type="all">Все</button>
            <button class="filter-btn" data-type="на время">На время</button>
            <button class="filter-btn" data-type="на материалы">На материалы</button>
            <button class="filter-btn" data-type="цветные">Цветные</button>
        </div>
    </header>

    <main id="cards-container"></main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const events = [
            {
                "id": 1,
                "название": "Лига Авантюристов",
                "тип": "на время",
                "этапы": [
                    "Этап 1",
                    "Этап 2",
                    "Этап 3"
                ],
                "призы": [
                    "Приз 1",
                    "Приз 2",
                    "Приз 3"
                ],
                "скриншоты": [
                    "https://via.placeholder.com/600x400/1a2a4a/d4af37?text=Скрин+1",
                    "https://via.placeholder.com/600x400/1a2a4a/d4af37?text=Скрин+2"
                ]
            }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('cards-container');
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modal-body');
            const closeBtn = document.querySelector('.close-btn');

            let currentEvents = [...events];

            function renderCards(filterType = 'all') {
                container.innerHTML = '';
                const filtered = filterType === 'all' ? currentEvents : currentEvents.filter(e => e.тип === filterType);
                filtered.forEach(event => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="${event.скриншоты[0]}" alt="${event.название}" onerror="this.src='https://via.placeholder.com/600x400/cccccc/1a2a4a?text=Нет+скрина'">
                        </div>
                        <div class="card-content">
                            <h3>${event.название}</h3>
                            <div class="type-wrapper">
                                <span class="type">${event.тип}</span>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal(event));
                    container.appendChild(card);
                });
            }

            function openModal(event) {
                let stagesHtml = event.этапы.map((stage, i) => `<li>${i+1}. ${stage}</li>`).join('');
                let rewardsHtml = event.призы.map(prize => `<li>${prize}</li>`).join('');
                let galleryHtml = event.скриншоты.map(src => `<img src="${src}" alt="скрин" onclick="window.open('${src}', '_blank')" onerror="this.style.display='none'">`).join('');

                modalBody.innerHTML = `
                    <h2>${event.название}</h2>
                    <div class="meta">Тип: ${event.тип}</div>
                    <div class="stages"><strong>Этапы:</strong><ul>${stagesHtml}</ul></div>
                    <div class="rewards"><strong>Призы:</strong><ul>${rewardsHtml}</ul></div>
                    <div class="gallery">${galleryHtml}</div>
                `;
                modal.style.display = 'block';
            }

            function closeModal() {
                modal.style.display = 'none';
            }

            closeBtn.addEventListener('click', closeModal);
            window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderCards(this.dataset.type);
                });
            });

            renderCards('all');
        });
    </script>
</body>
</html>
