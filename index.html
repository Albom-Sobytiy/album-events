<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альбом событий</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>📖 Альбом событий</h1>
        <div class="filters">
            <button class="filter-btn active" data-type="all">Все</button>
            <button class="filter-btn" data-type="на время">На время</button>
            <button class="filter-btn" data-type="на материалы">На материалы</button>
            <button class="filter-btn" data-type="цветные">Цветные</button>
        </div>
    </header>

    <main id="cards-container">
        <!-- Карточки будут созданы из events.js -->
    </main>

    <!-- Модальное окно для детального просмотра -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="events.js"></script>
    <script src="script.js"></script>
</body>
</html>
